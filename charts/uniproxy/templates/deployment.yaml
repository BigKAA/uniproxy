apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uniproxy.fullname" . }}
  labels:
    {{- include "uniproxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "uniproxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "uniproxy.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: uniproxy
          image: {{ include "uniproxy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # --- Core ---
            - name: DEPHEALTH_NAME
              value: {{ default (include "uniproxy.fullname" .) .Values.config.name | quote }}
            - name: LISTEN_ADDR
              value: {{ .Values.config.listenAddr | quote }}
            - name: DEPHEALTH_CHECK_INTERVAL
              value: {{ .Values.config.checkInterval | quote }}
            {{- if .Values.config.timeout }}
            - name: DEPHEALTH_TIMEOUT
              value: {{ .Values.config.timeout | quote }}
            {{- end }}
            {{- if .Values.config.fetchTimeout }}
            - name: DEPHEALTH_FETCH_TIMEOUT
              value: {{ .Values.config.fetchTimeout | quote }}
            {{- end }}
            {{- if .Values.config.deps }}
            - name: DEPHEALTH_DEPS
              value: {{ .Values.config.deps | quote }}
            {{- end }}
            # --- Logging ---
            {{- if .Values.log.format }}
            - name: LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- end }}
            {{- if .Values.log.level }}
            - name: LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            {{- end }}
            {{- if .Values.log.timeFormat }}
            - name: LOG_TIME_FORMAT
              value: {{ .Values.log.timeFormat | quote }}
            {{- end }}
            {{- if .Values.log.addSource }}
            - name: LOG_ADD_SOURCE
              value: {{ .Values.log.addSource | quote }}
            {{- end }}
            {{- if .Values.log.timeKey }}
            - name: LOG_TIME_KEY
              value: {{ .Values.log.timeKey | quote }}
            {{- end }}
            {{- if .Values.log.levelKey }}
            - name: LOG_LEVEL_KEY
              value: {{ .Values.log.levelKey | quote }}
            {{- end }}
            {{- if .Values.log.messageKey }}
            - name: LOG_MESSAGE_KEY
              value: {{ .Values.log.messageKey | quote }}
            {{- end }}
            {{- if .Values.log.sourceKey }}
            - name: LOG_SOURCE_KEY
              value: {{ .Values.log.sourceKey | quote }}
            {{- end }}
            # --- Server auth ---
            {{- with .Values.serverAuth }}
            {{- if and .method (ne .method "none") }}
            - name: AUTH_METHOD
              value: {{ .method | quote }}
            {{- if eq .method "basic" }}
            {{- if .username }}
            - name: AUTH_USER
              value: {{ .username | quote }}
            {{- end }}
            {{- if .existingSecret }}
            {{- if .passwordKey }}
            - name: AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .passwordKey }}
            {{- end }}
            {{- else if .password }}
            - name: AUTH_PASS
              value: {{ .password | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .method "bearer" }}
            {{- if .existingSecret }}
            {{- if .tokenKey }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .tokenKey }}
            {{- end }}
            {{- else if .token }}
            - name: AUTH_TOKEN
              value: {{ .token | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .method "apikey" }}
            {{- if .existingSecret }}
            {{- if .apiKeyKey }}
            - name: AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .apiKeyKey }}
            {{- end }}
            {{- else if .apiKey }}
            - name: AUTH_API_KEY
              value: {{ .apiKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Per-zone: status */}}
            {{- if .status }}
            {{- if .status.method }}
            - name: AUTH_STATUS_METHOD
              value: {{ .status.method | quote }}
            {{- if eq .status.method "basic" }}
            {{- if .status.username }}
            - name: AUTH_STATUS_USER
              value: {{ .status.username | quote }}
            {{- end }}
            {{- if .status.password }}
            - name: AUTH_STATUS_PASS
              value: {{ .status.password | quote }}
            {{- end }}
            {{- end }}
            {{- if and (eq .status.method "bearer") .status.token }}
            - name: AUTH_STATUS_TOKEN
              value: {{ .status.token | quote }}
            {{- end }}
            {{- if and (eq .status.method "apikey") .status.apiKey }}
            - name: AUTH_STATUS_API_KEY
              value: {{ .status.apiKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Per-zone: metrics */}}
            {{- if .metrics }}
            {{- if .metrics.method }}
            - name: AUTH_METRICS_METHOD
              value: {{ .metrics.method | quote }}
            {{- if eq .metrics.method "basic" }}
            {{- if .metrics.username }}
            - name: AUTH_METRICS_USER
              value: {{ .metrics.username | quote }}
            {{- end }}
            {{- if .metrics.password }}
            - name: AUTH_METRICS_PASS
              value: {{ .metrics.password | quote }}
            {{- end }}
            {{- end }}
            {{- if and (eq .metrics.method "bearer") .metrics.token }}
            - name: AUTH_METRICS_TOKEN
              value: {{ .metrics.token | quote }}
            {{- end }}
            {{- if and (eq .metrics.method "apikey") .metrics.apiKey }}
            - name: AUTH_METRICS_API_KEY
              value: {{ .metrics.apiKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            # --- YAML config file ---
            {{- if .Values.configFile.enabled }}
            - name: CONFIG_FILE
              value: "/config/config.yaml"
            {{- end }}
            # --- Pod identity ---
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # --- Extra env vars ---
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.configFile.enabled }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.configFile.enabled }}
      volumes:
        - name: config
          configMap:
            name: {{ include "uniproxy.fullname" . }}-config
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
