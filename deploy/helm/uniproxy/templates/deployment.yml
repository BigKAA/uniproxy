{{- range .Values.instances }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dephealth-uniproxy.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
      app.kubernetes.io/part-of: dephealth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: dephealth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: uniproxy
          image: {{ include "dephealth-uniproxy.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DEPHEALTH_NAME
              value: {{ .name | quote }}
            - name: DEPHEALTH_GROUP
              value: {{ .group | quote }}
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DEPHEALTH_CHECK_INTERVAL
              value: {{ $.Values.checkInterval | quote }}
            {{- if $.Values.timeout }}
            - name: DEPHEALTH_TIMEOUT
              value: {{ $.Values.timeout | quote }}
            {{- end }}
            {{- if $.Values.fetchTimeout }}
            - name: DEPHEALTH_FETCH_TIMEOUT
              value: {{ $.Values.fetchTimeout | quote }}
            {{- end }}
            {{- if .connections }}
            - name: DEPHEALTH_DEPS
              value: {{ include "dephealth-uniproxy.depsValue" .connections | quote }}
            {{- range .connections }}
            {{- $envPrefix := printf "DEPHEALTH_%s" (include "dephealth-uniproxy.envName" .name) }}
            {{- if .url }}
            - name: {{ $envPrefix }}_URL
              value: {{ .url | quote }}
            {{- else }}
            - name: {{ $envPrefix }}_HOST
              value: {{ .host | quote }}
            - name: {{ $envPrefix }}_PORT
              value: {{ .port | quote }}
            {{- end }}
            - name: {{ $envPrefix }}_CRITICAL
              value: {{ .critical | default "yes" | quote }}
            {{- if .healthPath }}
            - name: {{ $envPrefix }}_HEALTH_PATH
              value: {{ .healthPath | quote }}
            {{- end }}
            {{- if .checkInterval }}
            - name: {{ $envPrefix }}_CHECK_INTERVAL
              value: {{ .checkInterval | quote }}
            {{- end }}
            {{- if .timeout }}
            - name: {{ $envPrefix }}_TIMEOUT
              value: {{ .timeout | quote }}
            {{- end }}
            {{- if .tls }}
            - name: {{ $envPrefix }}_TLS
              value: {{ .tls | quote }}
            {{- end }}
            {{- if .tlsSkipVerify }}
            - name: {{ $envPrefix }}_TLS_SKIP_VERIFY
              value: {{ .tlsSkipVerify | quote }}
            {{- end }}
            {{- if .grpcServiceName }}
            - name: {{ $envPrefix }}_GRPC_SERVICE_NAME
              value: {{ .grpcServiceName | quote }}
            {{- end }}
            {{- if .postgresQuery }}
            - name: {{ $envPrefix }}_POSTGRES_QUERY
              value: {{ .postgresQuery | quote }}
            {{- end }}
            {{- if .mysqlQuery }}
            - name: {{ $envPrefix }}_MYSQL_QUERY
              value: {{ .mysqlQuery | quote }}
            {{- end }}
            {{- if .redisPassword }}
            - name: {{ $envPrefix }}_REDIS_PASSWORD
              value: {{ .redisPassword | quote }}
            {{- end }}
            {{- if .redisDB }}
            - name: {{ $envPrefix }}_REDIS_DB
              value: {{ .redisDB | quote }}
            {{- end }}
            {{- if .amqpURL }}
            - name: {{ $envPrefix }}_AMQP_URL
              value: {{ .amqpURL | quote }}
            {{- end }}
            {{- /* Authentication: inline values */}}
            {{- if .bearerToken }}
            - name: {{ $envPrefix }}_BEARER_TOKEN
              value: {{ .bearerToken | quote }}
            {{- end }}
            {{- if .basicUser }}
            - name: {{ $envPrefix }}_BASIC_USER
              value: {{ .basicUser | quote }}
            {{- end }}
            {{- if .basicPass }}
            - name: {{ $envPrefix }}_BASIC_PASS
              value: {{ .basicPass | quote }}
            {{- end }}
            {{- if .headers }}
            - name: {{ $envPrefix }}_HEADERS
              value: {{ .headers | quote }}
            {{- end }}
            {{- if .metadata }}
            - name: {{ $envPrefix }}_METADATA
              value: {{ .metadata | quote }}
            {{- end }}
            {{- /* Authentication: from Kubernetes Secret */}}
            {{- if .auth }}
            {{- if and .auth.existingSecret .auth.bearerTokenKey }}
            - name: {{ $envPrefix }}_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .auth.existingSecret }}
                  key: {{ .auth.bearerTokenKey }}
            {{- end }}
            {{- if and .auth.existingSecret .auth.basicUserKey }}
            - name: {{ $envPrefix }}_BASIC_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .auth.existingSecret }}
                  key: {{ .auth.basicUserKey }}
            {{- end }}
            {{- if and .auth.existingSecret .auth.basicPassKey }}
            - name: {{ $envPrefix }}_BASIC_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .auth.existingSecret }}
                  key: {{ .auth.basicPassKey }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Server-side authentication */}}
            {{- with $.Values.serverAuth }}
            {{- if and .method (ne .method "none") }}
            - name: AUTH_METHOD
              value: {{ .method | quote }}
            {{- if eq .method "basic" }}
            {{- if .username }}
            - name: AUTH_USER
              value: {{ .username | quote }}
            {{- end }}
            {{- if .existingSecret }}
            {{- if .passwordKey }}
            - name: AUTH_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .passwordKey }}
            {{- end }}
            {{- else if .password }}
            - name: AUTH_PASS
              value: {{ .password | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .method "bearer" }}
            {{- if .existingSecret }}
            {{- if .tokenKey }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .tokenKey }}
            {{- end }}
            {{- else if .token }}
            - name: AUTH_TOKEN
              value: {{ .token | quote }}
            {{- end }}
            {{- end }}
            {{- if eq .method "apikey" }}
            {{- if .existingSecret }}
            {{- if .apiKeyKey }}
            - name: AUTH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .apiKeyKey }}
            {{- end }}
            {{- else if .apiKey }}
            - name: AUTH_API_KEY
              value: {{ .apiKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Per-zone: status */}}
            {{- if .status }}
            {{- if .status.method }}
            - name: AUTH_STATUS_METHOD
              value: {{ .status.method | quote }}
            {{- if eq .status.method "basic" }}
            {{- if .status.username }}
            - name: AUTH_STATUS_USER
              value: {{ .status.username | quote }}
            {{- end }}
            {{- if .status.password }}
            - name: AUTH_STATUS_PASS
              value: {{ .status.password | quote }}
            {{- end }}
            {{- end }}
            {{- if and (eq .status.method "bearer") .status.token }}
            - name: AUTH_STATUS_TOKEN
              value: {{ .status.token | quote }}
            {{- end }}
            {{- if and (eq .status.method "apikey") .status.apiKey }}
            - name: AUTH_STATUS_API_KEY
              value: {{ .status.apiKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Per-zone: metrics */}}
            {{- if .metrics }}
            {{- if .metrics.method }}
            - name: AUTH_METRICS_METHOD
              value: {{ .metrics.method | quote }}
            {{- if eq .metrics.method "basic" }}
            {{- if .metrics.username }}
            - name: AUTH_METRICS_USER
              value: {{ .metrics.username | quote }}
            {{- end }}
            {{- if .metrics.password }}
            - name: AUTH_METRICS_PASS
              value: {{ .metrics.password | quote }}
            {{- end }}
            {{- end }}
            {{- if and (eq .metrics.method "bearer") .metrics.token }}
            - name: AUTH_METRICS_TOKEN
              value: {{ .metrics.token | quote }}
            {{- end }}
            {{- if and (eq .metrics.method "apikey") .metrics.apiKey }}
            - name: AUTH_METRICS_API_KEY
              value: {{ .metrics.apiKey | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* YAML config file */}}
            {{- if $.Values.configFile.enabled }}
            - name: CONFIG_FILE
              value: "/config/config.yaml"
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- if $.Values.configFile.enabled }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: {{ $.Values.probes.readinessDelay }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: {{ $.Values.probes.livenessDelay }}
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
      {{- if $.Values.configFile.enabled }}
      volumes:
        - name: config
          configMap:
            name: {{ .name }}-config
      {{- end }}
{{- end }}
