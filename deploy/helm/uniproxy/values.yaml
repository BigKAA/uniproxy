# dephealth-uniproxy — default values
#
# Usage:
#   helm install dephealth-uniproxy-ns1 deploy/helm/dephealth-uniproxy/ \
#     -f deploy/helm/dephealth-uniproxy/values-homelab.yaml \
#     -f deploy/helm/dephealth-uniproxy/instances/ns1-homelab.yaml \
#     -n dephealth-uniproxy --create-namespace

global:
  pushRegistry: ""

image:
  name: uniproxy
  tag: latest
  pullPolicy: IfNotPresent

# Check interval in seconds (passed as DEPHEALTH_CHECK_INTERVAL env var).
checkInterval: "10"

# Global check timeout in seconds (passed as DEPHEALTH_TIMEOUT env var).
# Empty string means SDK default.
timeout: ""

# Timeout in seconds for recursive HTTP detail fetch (passed as DEPHEALTH_FETCH_TIMEOUT).
# Used by GET /?detail=true&depth=N to fetch downstream uniproxy responses.
fetchTimeout: "5"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

probes:
  readinessDelay: 5
  livenessDelay: 5

# Server-side authentication for uniproxy endpoints.
# Protects / (status API) and /metrics independently.
# /healthz and /readyz are always open.
serverAuth:
  # Global auth method: none | basic | bearer | apikey
  method: "none"
  # Global credentials (used as fallback for zones):
  # username: ""
  # password: ""
  # token: ""
  # apiKey: ""
  #
  # Use an existing Kubernetes Secret for credentials:
  # existingSecret: ""
  # tokenKey: ""       — key in Secret for bearer token
  # passwordKey: ""    — key in Secret for password
  # apiKeyKey: ""      — key in Secret for API key
  #
  # Per-zone overrides:
  # status:
  #   method: "basic"
  #   username: "admin"
  #   password: "secret"
  # metrics:
  #   method: "none"

# YAML configuration file (alternative to env vars).
# If configFile.enabled=true, a ConfigMap with the YAML content is created
# and mounted as CONFIG_FILE in the container.
configFile:
  enabled: false
  # content: |
  #   name: my-proxy
  #   dependencies:
  #     - name: httpbin
  #       type: http
  #       url: "http://httpbin.org"
  #       critical: true

# Instance list. Each instance defines a uniproxy deployment with its own connections.
#
# Connection auth options (per-connection, all optional):
#   bearerToken: "token"         — inline bearer token
#   basicUser: "user"            — inline Basic Auth username
#   basicPass: "password"        — inline Basic Auth password
#   headers: '{"X-Key":"val"}'   — HTTP-only: custom headers (JSON string)
#   metadata: '{"key":"val"}'    — gRPC-only: custom metadata (JSON string)
#
# Using Kubernetes Secrets (recommended for production):
#   auth:
#     existingSecret: "my-secret"        — K8s Secret name
#     bearerTokenKey: "token"            — key in Secret for bearer token
#     basicUserKey: "username"           — key in Secret for Basic Auth user
#     basicPassKey: "password"           — key in Secret for Basic Auth password
#
# Note: inline values and existingSecret can be combined (e.g., inline headers + secret bearer).
# Only one auth method per connection: bearer OR basic auth (not both).
instances: []
