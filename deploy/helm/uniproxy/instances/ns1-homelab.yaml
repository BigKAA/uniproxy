instances:
  - name: uniproxy-01
    group: ns1
    replicas: 2
    nodePort: 30080
    connections:
      - name: uniproxy-02
        type: http
        url: "http://uniproxy-02.dephealth-uniproxy.svc:8080"
        critical: "yes"
        healthPath: "/"
      - name: uniproxy-03
        type: http
        url: "http://uniproxy-03.dephealth-uniproxy.svc:8080"
        critical: "yes"
        healthPath: "/"

  - name: uniproxy-02
    group: ns1
    replicas: 2
    connections:
      - name: redis
        type: redis
        url: "redis://redis.dephealth-redis.svc:6379"
        critical: "no"
      - name: grpc-stub
        type: grpc
        host: "grpc-stub.dephealth-grpc-stub.svc"
        port: "9090"
        critical: "no"
      - name: uniproxy-04
        type: http
        url: "http://uniproxy-04.dephealth-uniproxy-2.svc:8080"
        critical: "yes"
        healthPath: "/"

  - name: uniproxy-03
    group: ns1
    replicas: 3
    connections:
      - name: postgresql
        type: postgres
        url: "postgres://dephealth:dephealth-test-pass@postgresql.dephealth-postgresql.svc:5432/dephealth"
        critical: "yes"
      # LDAP example (uncomment to enable):
      # - name: corp-ldap
      #   type: ldap
      #   url: "ldap://ldap.example.com:389"
      #   critical: "no"
      #   ldapCheckMethod: "root_dse"
      #   # For simple_bind:
      #   # ldapCheckMethod: "simple_bind"
      #   # ldapBindDN: "cn=healthcheck,dc=example,dc=com"
      #   # ldapBindPassword: "secret"
      #   # ldapStartTLS: "true"
      #   # Or use Kubernetes Secret:
      #   # auth:
      #   #   existingSecret: "ldap-creds"
      #   #   ldapBindPasswordKey: "bind-password"
