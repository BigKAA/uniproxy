# uniproxy — full YAML configuration example
#
# Usage:
#   docker run -e CONFIG_FILE=/config/config.yaml \
#     -v ./config.yaml:/config/config.yaml:ro uniproxy:0.6.0
#
# Environment variables always override YAML values.
# See README.md for details on priority rules.

# Application name (required). Used in metrics labels and status API responses.
name: my-proxy

# Logical group (required). Added to all Prometheus metrics as the "group" label.
# Useful for grouping instances by team, environment, or service tier.
group: my-group

# HTTP server listen address.
listenAddr: ":8080"

# Mark this application as an entry point in topology visualization.
# Adds isentry=yes label to all dependency metrics.
# isEntry: true

# Health check interval. Supports Go duration ("15s", "1m30s") or seconds ("15").
checkInterval: "15s"

# Global health check timeout. Empty or omitted means SDK default.
# timeout: "5s"

# Timeout for recursive HTTP detail fetch (GET /?detail=true&depth=N).
fetchTimeout: "3s"

# Graceful shutdown timeout (default: 30s).
# Time to wait for active requests to complete before force shutdown.
# shutdownTimeout: "30s"

# Circuit breaker settings for downstream HTTP fetches.
# Controls resilience when fetching from upstream uniproxy instances.
# circuitBreaker:
#   maxFailures: 5        # Open circuit after 5 consecutive failures
#   timeout: "60s"         # Time in open state before half-open
#   halfOpenLimit: 3       # Test requests allowed in half-open state

# HTTP client transport settings for connection pooling.
# Controls how connections are reused for downstream HTTP fetches.
# httpTransport:
#   maxIdleConns: 100           # Total idle connections across all hosts
#   maxIdleConnsPerHost: 10     # Idle connections per single host
#   idleConnTimeout: "90s"      # Idle connection timeout

# Structured logging configuration.
log:
  # Output format: "text" or "json".
  format: json
  # Log level: "debug", "info", "warn", "error".
  level: info
  # Timestamp format: "rfc3339", "rfc3339nano", "unix", "unixmilli".
  timeFormat: rfc3339nano
  # Include source file:line in log output.
  addSource: false
  # Custom JSON keys (only effective with format: json).
  # timeKey: "ts"
  # levelKey: "severity"
  # messageKey: "message"
  # sourceKey: "caller"

# Server-side authentication for uniproxy endpoints.
# Protects / (status API) and /metrics independently.
# /healthz and /readyz are always open.
auth:
  # Global auth method applied to all protected zones.
  # Supported: "none", "basic", "bearer", "apikey".
  method: bearer
  # Credentials for the chosen method:
  # username: "admin"       # basic auth
  # password: "secret"      # basic auth
  token: "my-secret-token"  # bearer auth
  # apiKey: "key-123"       # apikey auth

  # Per-zone overrides. Each zone inherits global settings
  # unless explicitly overridden here.
  status:
    # Override for / endpoint. Inherits global if omitted.
    method: bearer
    token: "status-specific-token"

  metrics:
    # Override for /metrics endpoint.
    # Set to "none" to leave metrics open while protecting status.
    method: none

# Dependencies to health-check.
dependencies:
  # HTTP dependency with URL.
  - name: backend
    type: http
    url: "http://backend.svc:8080"
    critical: true
    healthPath: "/"
    # Per-dependency check interval and timeout (override global).
    # checkInterval: "5s"
    # timeout: "3s"
    # TLS options:
    # tls: true
    # tlsSkipVerify: false
    # Dependency authentication (outgoing requests):
    auth:
      bearerToken: "dep-auth-token"

  # HTTP dependency with host + port.
  - name: api-gateway
    type: http
    host: api.example.com
    port: "443"
    critical: true
    tls: true
    auth:
      basicUser: "service"
      basicPass: "password"

  # HTTP dependency behind ingress/gateway — custom Host header.
  # When health-checking a service by IP address behind an ingress controller
  # or reverse proxy, the Host header must match the virtual host routing rule.
  # With TLS, hostHeader also sets the SNI (ServerName).
  - name: ingress-app
    type: http
    host: "192.168.1.100"
    port: "443"
    critical: true
    tls: true
    tlsSkipVerify: true
    hostHeader: "app.example.com"

  # gRPC dependency.
  - name: grpc-service
    type: grpc
    host: grpc.svc
    port: "9090"
    critical: false
    # grpcServiceName: "my.service.v1"
    auth:
      metadata:
        x-api-key: "grpc-key"

  # gRPC dependency behind reverse proxy — custom :authority.
  # When a gRPC service is behind envoy or nginx gRPC proxy, the :authority
  # pseudo-header must match the routing rule. With TLS, also sets SNI.
  - name: grpc-proxy
    type: grpc
    host: "10.0.0.50"
    port: "8443"
    critical: false
    tls: true
    tlsSkipVerify: true
    grpcAuthority: "grpc.example.com"

  # Redis dependency.
  - name: cache
    type: redis
    url: "redis://redis.svc:6379"
    critical: false
    # redisPassword: "redis-pass"
    # redisDB: 0

  # PostgreSQL dependency.
  - name: database
    type: postgres
    url: "postgres://user:pass@pg.svc:5432/mydb"
    critical: true
    # postgresQuery: "SELECT 1"

  # MySQL dependency.
  # - name: mysql-db
  #   type: mysql
  #   url: "user:pass@tcp(mysql.svc:3306)/mydb"
  #   critical: true
  #   mysqlQuery: "SELECT 1"

  # TCP dependency (simple port check).
  # - name: smtp
  #   type: tcp
  #   host: smtp.svc
  #   port: "25"
  #   critical: false

  # AMQP dependency.
  # - name: rabbitmq
  #   type: amqp
  #   url: "amqp://user:pass@rabbitmq.svc:5672/"
  #   critical: false

  # Kafka dependency.
  # - name: kafka
  #   type: kafka
  #   host: kafka.svc
  #   port: "9092"
  #   critical: false

# TLS/SSL configuration for HTTPS server.
# When enabled, server listens on :8443 by default (configurable via listenAddr).
# Supports two modes:
#   1. File-based: provide certFile and keyFile paths
#   2. Inline: provide certData and keyData with PEM content
# The inline mode is useful for Kubernetes deployments where certificates
# are stored in Secrets and passed as environment variables.
# tls:
#   enabled: true
#   # For file-based certificates:
#   certFile: /certs/server.crt
#   keyFile: /certs/server.key
#   # For inline certificates (uncomment and use one mode):
#   # certData: |
#   #   -----BEGIN CERTIFICATE-----
#   #   MIIDXTCCAkWgAwIBAgIJAKZ...
#   #   -----END CERTIFICATE-----
#   # keyData: |
#   #   -----BEGIN PRIVATE KEY-----
#   #   MIIEvQIBADANBgkqhkiG9w0B...
#   #   -----END PRIVATE KEY-----
#   # Override default :8443 listen address when TLS is enabled:
#   # listenAddr: ":8443"
